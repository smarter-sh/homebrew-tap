# The lint standard of the repository. Install with make init.
# Homebrew loads only Formula/*.rb; none of these hooks change what it installs.
# Install the commit-msg hook too, so that commitlint checks each commit message.
default_install_hook_types: [pre-commit, commit-msg]
# Hooks run at the pre-commit stage only, unless they say otherwise: commitlint runs at commit-msg.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words=codespell.txt"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      # The same RuboCop rules as brew test-bot --only-tap-syntax. Needs Homebrew.
      - id: brew-style
        name: brew style
        entry: brew style
        language: system
        files: ^Formula/.*\.rb$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: trailing-whitespace
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional", "@commitlint/config-angular"]
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
  skip: [brew-style, commitlint]
