---
#------------------------------------------------------------------------------
# brew test-bot.
#
# Homebrew's standard test workflow for a tap (from brew tap-new), on
# ubuntu-24.04 and macos-15. It runs on pushes to main, which include
# smarter-cli's Build-Release homebrew job, the one that updates
# Formula/smarter.rb (commits "[CI/CD] release <version>"); on pull requests;
# and on workflow_dispatch, which smarter-sh/automation's nightly Repository
# Tests use to start it. Keep that trigger.
#
# Every event runs setup and tap-syntax: Ruby syntax, brew readall, and
# brew style on the whole tap, which also lints shell scripts (shellcheck,
# shfmt) and ruby code blocks in Markdown files, skills/ included. Only pull
# requests run the formulae step, which downloads the release binary, checks
# its sha256, installs it, runs the formula's test (smarter version), audits
# it, and uploads any bottles as artifacts. The formula installs a macOS
# binary only.
#
# make lint and make test reproduce the syntax checks locally.
#
# Secrets: none; it uses the default GITHUB_TOKEN.
#------------------------------------------------------------------------------
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  # the organization's nightly Repository Tests start this workflow by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
