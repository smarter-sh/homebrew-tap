---
#------------------------------------------------------------------------------
# brew pr-pull.
#
# Homebrew's standard bottle-publishing workflow for a tap (from
# brew tap-new). When a maintainer adds the pr-pull label to a pull request
# whose brew test-bot run built bottles, it downloads them, adds their
# bottle block to the formula, pushes the commits to main, and deletes the
# pull request's branch.
#
# It isn't part of the release path. smarter-cli's Build-Release homebrew job
# pushes formula updates to main directly, and Formula/smarter.rb installs a
# prebuilt binary, so it has no bottles. Every other label, Dependabot's
# included, starts this workflow but skips its job.
#
# It runs on pull_request_target, with write access to the repository, so
# only a maintainer adds the pr-pull label, and only after reviewing the pull
# request.
#
# Secrets: none; it uses the default GITHUB_TOKEN (contents and pull-requests:
# write).
#------------------------------------------------------------------------------
name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: read

jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read # brew pr-pull reads the test-bot run and downloads its bottle artifacts
      checks: read
      contents: write # pushes the bottle commits to main, and deletes the branch
      pull-requests: write # brew pr-pull updates the pull request
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@55301c8cac0982bc2fbeb71275fa0b71b963bdb1 # main

      - name: Set up git
        uses: Homebrew/actions/git-user-config@55301c8cac0982bc2fbeb71275fa0b71b963bdb1 # main

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@55301c8cac0982bc2fbeb71275fa0b71b963bdb1 # main
        with:
          token: ${{ github.token }}
          branch: main

      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"
